name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @homeoassist/domain && npm run build -w @homeoassist/print
      - run: npm run lint

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SUPABASE_URL: "https://test.supabase.co"
      SUPABASE_ANON_KEY: "test-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @homeoassist/domain && npm run build -w @homeoassist/print
      - run: npm run test:api
      - name: API coverage
        run: npm --workspace @homeoassist/api run test:coverage
        continue-on-error: true

  test-web:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @homeoassist/domain && npm run build -w @homeoassist/print
      - run: npm run test:web


  integration-api:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @homeoassist/domain && npm run build -w @homeoassist/print
      - name: Run integration tests
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            npm --workspace @homeoassist/api run test -- src/__tests__
          else
            echo "Skipping integration tests as SUPABASE_URL is missing."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
