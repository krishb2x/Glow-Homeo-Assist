# Production-style local stack. Requires .env at repo root.
# Usage: docker compose -f infra/docker-compose.prod.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID: ${NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
