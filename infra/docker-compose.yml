version: "3.9"
services:
  api:
    image: node:22
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:api"
    ports:
      - "4000:4000"
    volumes:
      - ../:/workspace
  web:
    image: node:22
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../:/workspace
